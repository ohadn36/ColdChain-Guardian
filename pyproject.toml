[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coldchain-guardian"
version = "0.1.0"
description = "Local-first IoT monitoring and control system for temperature-sensitive shipments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "PySide6>=6.8,<7",
    "pyqtgraph>=0.13.7,<0.15",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["coldchain_guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

